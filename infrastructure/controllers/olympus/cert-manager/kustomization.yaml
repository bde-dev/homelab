apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CRDs are managed here rather than by the Helm chart (release.yaml sets installCRDs:false)
  # so Flux's CRD-first apply staging registers them before any Certificate/ClusterIssuer in
  # this layer is validated. Version is tracked by a Renovate customManager, grouped with the
  # chart so the two move together.
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.0/cert-manager.crds.yaml
  - repository.yaml
  - release.yaml
  - namespace.yaml
  - secrets.yaml
  - cluster-issuer.yaml
